name: Agent - Review

# Triggered when a PR is opened or updated. The Reviewer agent reviews the diff,
# posts inline comments, and emits a PASS/BLOCK verdict. agent-merge.yml merges a
# `claude/issue-*` PR only once this job and CI have passed on its head: a BLOCK
# verdict (or a reviewer error) fails the job, which holds the merge. It is
# read-only on the repository code: it can never push or modify `main`.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege: read the code, write only PR comments. NO `contents: write`, so
# even a prompt-injection attempt in the diff cannot push code. The verdict is a
# local file on the runner, never a repository write.
# `id-token: write` lets the Claude action mint its GitHub App token via OIDC.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gate below trusts review-verdict.txt. A PR that commits that file
      # would otherwise pass this check whenever the reviewer ends without
      # writing one (crash, turn cap), turning fail-closed into fail-open.
      - name: Discard any verdict file from the PR
        run: rm -f review-verdict.txt

      - name: Notify Slack - review started
        if: github.event.action == 'opened'
        uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: |
            :mag: *Review started* on PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.html_url }}

      # The linked issue is the spec the review checks the PR against. Saved inside
      # the workspace so the agent can Read it; it is untracked, so it never shows
      # in the diff. The agent treats it as untrusted input, like the diff.
      - name: Collect the linked issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          out=".review-context/linked-issues.md"
          mkdir -p .review-context
          nums="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json closingIssuesReferences --jq '.closingIssuesReferences[].number')"
          if [ -z "$nums" ]; then
            echo "This PR closes no issue: there is no spec to check it against." > "$out"
          else
            for n in $nums; do
              gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json number,title,body \
                --jq '"# Issue #\(.number): \(.title)\n\n\(.body)\n"' >> "$out"
            done
          fi
          wc -c "$out"

      - name: Run Reviewer agent
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PRs in this pipeline are opened by the Implementer as `claude[bot]`. By
          # default the action refuses bot-initiated events ("Workflow initiated by
          # non-human actor"); allow our own bot so its PRs get reviewed. Scoped to
          # `claude` rather than `*` to keep least privilege — the reviewer is already
          # read-only (`contents: read`), so this only widens *who* it reviews.
          allowed_bots: "claude"
          # Force tag mode with a tracking comment so the review is posted on the PR.
          track_progress: true
          prompt: |
            You are the read-only Reviewer for this repository. Operate exactly as
            specified in `.claude/agents/reviewer.md`: read `REVIEW.md` (the
            project's review rulebook) and `CLAUDE.md` first.

            Review PR #${{ github.event.pull_request.number }} against
            `origin/${{ github.event.pull_request.base.ref }}`. The issue(s) it
            closes, which are its spec, are saved in
            `.review-context/linked-issues.md`.

            Post each finding as an inline comment with
            `mcp__github_inline_comment__create_inline_comment`, and the summary in
            the progress comment, in the formats `reviewer.md` defines. Do not edit
            source files, approve, or merge. Write everything in English.

            This review is a merge gate: `agent-merge.yml` merges the PR only if you
            record PASS. As soon as you have decided, and before posting the summary,
            run exactly one of `echo PASS > review-verdict.txt` or
            `echo BLOCK > review-verdict.txt`, following the verdict rules in
            `reviewer.md`. Overwrite it if you change your mind. That file is the
            only one you may create.
          # Read/Glob/Grep let the reviewer read surrounding code for context
          # (previously denied, since only the two Bash patterns were allowed). It
          # stays strictly read-only: Edit/Write remain disallowed and the token is
          # `contents: read`, so it can analyze and comment but never modify code.
          # Bash is limited to git (diff) and echo (the PASS/BLOCK verdict file).
          #
          # `mcp__github_inline_comment__create_inline_comment`: the action installs
          # its inline-comment server only when this tool is allowed. Without it the
          # reviewer had no way to comment on lines, and posted 0 inline comments
          # across ~195 runs on the first project that ran this pipeline.
          #
          # `--max-turns`: raised 20 -> 40. Over those runs the median review took
          # 14 turns and the longest 33; 38 runs (~20%) hit the cap and ended with
          # no verdict, some after already concluding PASS. Now that agent-merge.yml
          # waits for this check, a capped run sends the PR to agent-auto-retry.yml,
          # which closes it and re-implements the issue from scratch.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,TodoWrite,Bash(git:*),Bash(echo:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,WebSearch,WebFetch"

      # Turn the agent's verdict into the job's pass/fail status so it can gate the
      # merge as a required check. Fail-closed: a missing verdict (agent crashed,
      # timed out, or never wrote the file) blocks the merge rather than letting an
      # unreviewed change through.
      - name: Gate merge on review verdict
        id: gate
        if: always()
        env:
          AGENT_OUTCOME: ${{ steps.review.outcome }}
        run: |
          if [ ! -f review-verdict.txt ]; then
            echo "verdict=ERROR" >> "$GITHUB_OUTPUT"
            echo "::error::Reviewer produced no verdict (agent outcome: ${AGENT_OUTCOME}). Blocking merge (fail-closed)."
            exit 1
          fi
          verdict="$(tr -d '[:space:]' < review-verdict.txt)"
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          if [ "${verdict}" = "PASS" ]; then
            echo "Review verdict: PASS — merge gate is green."
            exit 0
          fi
          echo "::error::Review verdict: ${verdict} — blocking merge until the findings are addressed."
          exit 1

      - name: Notify Slack - review passed
        if: ${{ !cancelled() && steps.gate.outputs.verdict == 'PASS' }}
        uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: |
            :white_check_mark: *Review PASSED* on PR #${{ github.event.pull_request.number }} — merge gate is green.
            ${{ github.event.pull_request.html_url }}

      - name: Notify Slack - review blocked
        if: ${{ !cancelled() && steps.gate.outputs.verdict == 'BLOCK' }}
        uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: |
            :no_entry: *Review BLOCKED* PR #${{ github.event.pull_request.number }} — merge is held until the findings are addressed. See the review comments.
            ${{ github.event.pull_request.html_url }}

      - name: Notify Slack - reviewer errored
        if: ${{ !cancelled() && steps.gate.outputs.verdict != 'PASS' && steps.gate.outputs.verdict != 'BLOCK' }}
        uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: |
            :x: *Reviewer ERRORED* on PR #${{ github.event.pull_request.number }} — no verdict produced; merge blocked (fail-closed).
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
